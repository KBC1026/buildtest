<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="OpenAI API 키로 바로 사용해 보는 AI Chat 웹페이지" />
  <title>AI Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">OpenAI Responses API</p>
        <h1>AI Chat</h1>
      </div>
      <button id="clearChatButton" class="ghost" type="button">대화 지우기</button>
    </header>

    <section class="settings" aria-label="API 설정">
      <label>
        Model
        <select id="modelSelect">
          <option value="gpt-5.4-mini" selected>gpt-5.4-mini</option>
          <option value="gpt-5.4">gpt-5.4</option>
          <option value="gpt-5.5">gpt-5.5</option>
          <option value="gpt-5-mini">gpt-5-mini</option>
        </select>
      </label>
    </section>

    <p class="security-note">
      API 키는 브라우저에 입력하지 않습니다. 서버의 OPENAI_API_KEY 환경변수로만 사용됩니다.
    </p>

    <section id="chatLog" class="chat-log" aria-live="polite" aria-label="채팅 내용"></section>

    <form id="chatForm" class="composer">
      <label class="sr-only" for="messageInput">메시지</label>
      <textarea id="messageInput" rows="3" placeholder="메시지를 입력하세요"></textarea>
      <button id="sendButton" type="submit">전송</button>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
