<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="간단하게 사용할 수 있는 제비뽑기 웹페이지" />
  <title>제비뽑기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="intro">
      <p class="eyebrow">간단한 추첨 도구</p>
      <h1>제비뽑기</h1>
      <p>전체 제비 수와 당첨 수를 정한 뒤 섞고, 원하는 제비를 눌러 결과를 확인하세요.</p>
    </section>

    <section class="controls" aria-label="제비 설정">
      <label>
        전체 제비 수
        <input id="totalCount" type="number" min="2" max="50" value="10" />
      </label>
      <label>
        당첨 수
        <input id="winnerCount" type="number" min="1" max="49" value="2" />
      </label>
      <label>
        표시 이름
        <input id="labelPrefix" type="text" maxlength="12" value="제비" />
      </label>
    </section>

    <div class="actions">
      <button id="shuffleButton" type="button">섞기</button>
      <button id="resetButton" class="secondary" type="button">초기화</button>
    </div>

    <section id="drawArea" class="draw-area" aria-live="polite"></section>
    <div id="result" class="result" role="status"></div>
  </main>

  <script src="main.js"></script>
</body>
</html>
