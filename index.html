<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제비뽑기</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #5b6778;
      --line: #d9e0ea;
      --primary: #1769e0;
      --primary-dark: #0f55b8;
      --win: #0f8a5f;
      --lose: #a33b35;
      --shadow: 0 16px 40px rgba(23, 32, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(23, 105, 224, 0.16), transparent 30rem),
        linear-gradient(135deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(92vw, 760px);
      padding: 28px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3.25rem);
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 28px 0 22px;
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.16);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }

    button {
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 6px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      background: #e8eef7;
      color: var(--text);
    }

    button.secondary:hover {
      background: #dbe5f2;
    }

    .draw-area {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(86px, 1fr));
      gap: 12px;
      min-height: 112px;
    }

    .lot {
      min-height: 96px;
      display: grid;
      place-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f9fbfe;
      color: var(--muted);
      font-weight: 900;
      text-align: center;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
      user-select: none;
    }

    .lot:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .lot.open {
      background: #eef7f3;
      color: var(--win);
      cursor: default;
    }

    .lot.open.lose {
      background: #fff0ef;
      color: var(--lose);
    }

    .result {
      min-height: 34px;
      margin-top: 18px;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 800;
    }

    @media (max-width: 640px) {
      body {
        place-items: start center;
        padding: 18px 0;
      }

      main {
        padding: 22px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .actions {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>제비뽑기</h1>
    <p>전체 제비 수와 당첨 수를 정한 뒤 섞기 버튼을 누르고 원하는 제비를 뽑으세요.</p>

    <section class="controls" aria-label="제비 설정">
      <label>
        전체 제비 수
        <input id="totalCount" type="number" min="2" max="50" value="10" />
      </label>
      <label>
        당첨 수
        <input id="winnerCount" type="number" min="1" max="49" value="2" />
      </label>
      <label>
        표시 이름
        <input id="labelPrefix" type="text" maxlength="12" value="제비" />
      </label>
    </section>

    <div class="actions">
      <button id="shuffleButton" type="button">섞기</button>
      <button id="resetButton" class="secondary" type="button">초기화</button>
    </div>

    <section id="drawArea" class="draw-area" aria-live="polite"></section>
    <div id="result" class="result" role="status"></div>
  </main>

  <script>
    const totalInput = document.querySelector("#totalCount");
    const winnerInput = document.querySelector("#winnerCount");
    const prefixInput = document.querySelector("#labelPrefix");
    const shuffleButton = document.querySelector("#shuffleButton");
    const resetButton = document.querySelector("#resetButton");
    const drawArea = document.querySelector("#drawArea");
    const result = document.querySelector("#result");

    let lots = [];
    let openedCount = 0;

    function clampSettings() {
      const total = Math.min(50, Math.max(2, Number(totalInput.value) || 10));
      const winners = Math.min(total - 1, Math.max(1, Number(winnerInput.value) || 1));

      totalInput.value = total;
      winnerInput.max = total - 1;
      winnerInput.value = winners;

      return { total, winners };
    }

    function createLots() {
      const { total, winners } = clampSettings();
      const pool = Array.from({ length: total }, (_, index) => index < winners);

      for (let i = pool.length - 1; i > 0; i -= 1) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[randomIndex]] = [pool[randomIndex], pool[i]];
      }

      lots = pool;
      openedCount = 0;
      result.textContent = "제비가 준비되었습니다.";
      renderLots();
    }

    function renderLots() {
      const prefix = prefixInput.value.trim() || "제비";
      drawArea.innerHTML = "";

      lots.forEach((isWinner, index) => {
        const lot = document.createElement("button");
        lot.type = "button";
        lot.className = "lot";
        lot.textContent = `${prefix} ${index + 1}`;
        lot.setAttribute("aria-label", `${prefix} ${index + 1} 뽑기`);
        lot.addEventListener("click", () => openLot(lot, isWinner));
        drawArea.append(lot);
      });
    }

    function openLot(lot, isWinner) {
      if (lot.classList.contains("open")) return;

      openedCount += 1;
      lot.classList.add("open");
      lot.disabled = true;
      lot.textContent = isWinner ? "당첨" : "꽝";

      if (!isWinner) {
        lot.classList.add("lose");
      }

      result.textContent = isWinner
        ? `축하합니다. ${openedCount}번째 뽑기에서 당첨입니다.`
        : `${openedCount}번째 뽑기는 꽝입니다.`;
    }

    function reset() {
      totalInput.value = 10;
      winnerInput.value = 2;
      prefixInput.value = "제비";
      createLots();
    }

    shuffleButton.addEventListener("click", createLots);
    resetButton.addEventListener("click", reset);
    totalInput.addEventListener("change", clampSettings);
    winnerInput.addEventListener("change", clampSettings);
    prefixInput.addEventListener("input", renderLots);

    createLots();
  </script>
</body>
</html>
